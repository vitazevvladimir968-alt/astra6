<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Astra 6">
<link rel="manifest" href="manifest.json">
<title>Astra 6</title>
<link rel="stylesheet" href="style.css?v=5">
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div class="app">
<header class="topbar">
  <button class="brand" id="newChat" type="button"><span class="brand-mark">✦</span><span><b>Astra 6</b><small>Джарвис</small></span></button>
  <div class="top-actions"><button id="voiceMode" class="icon-btn" type="button" title="Голосовой режим">◉</button><button id="menuBtn" class="icon-btn" type="button">•••</button></div>
</header>
<main id="chat">
<section class="welcome" id="welcome">
  <div class="welcome-mark">✦</div>
  <h1>Чем могу помочь?</h1>
  <p>Я Джарвис — помощник внутри Astra 6.</p>
</section>
</main>
<div class="voice-panel" id="voicePanel" hidden>
  <div class="voice-orb" id="voiceOrb">✦</div><strong>Джарвис слушает</strong><span id="voiceStatus">Говорите…</span>
  <button id="stopVoice" type="button">Завершить</button>
</div>
<footer>
  <div id="filePreview"></div>
  <div class="composer">
    <button class="round-btn" id="attach" type="button" title="Добавить файл">＋</button>
    <textarea id="input" placeholder="Сообщение…" rows="1" autocomplete="off"></textarea>
    <button class="round-btn mic" id="mic" type="button" title="Голосовой ввод">⌁</button>
    <button class="send" id="send" type="button" title="Отправить">↑</button>
  </div>
  <div class="composer-tools">
    <label><input id="webMode" type="checkbox"> Поиск</label>
    <label><input id="imageMode" type="checkbox"> Изображение</label>
    <span id="status">Готово</span>
  </div>
  <small>Джарвис • Astra 6</small>
  <input id="fileInput" type="file" hidden>
</footer>
</div>
<script type="module" src="app.js?v=5"></script>
</body>
</html>
